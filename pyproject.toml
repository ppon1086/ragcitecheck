[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragcitecheck"
version = "0.2.1"
description = "Measure citation and evidence stability in RAG pipelines across runs and configuration changes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.1,<3",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<3",
]

[project.scripts]
ragcitecheck = "ragcitecheck.cli:main"

[tool.setuptools.packages.find]
include = ["ragcitecheck*"]
